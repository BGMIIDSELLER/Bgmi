
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BGMI ID Store</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    color:#222;
}

header{
    background:#111;
    color:white;
    padding:18px;
    text-align:center;
}

header h1{
    font-size:24px;
}

.container{
    max-width:500px;
    margin:auto;
    padding:15px;
}

.product{
    background:white;
    border-radius:15px;
    padding:12px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.video{
    width:100%;
    border-radius:12px;
    display:block;
    background:#000;
    margin-bottom:10px;
}

.gallery{
    display:flex;
    overflow-x:auto;
    gap:8px;
    scroll-snap-type:x mandatory;
    scrollbar-width:none;
}

.gallery::-webkit-scrollbar{
    display:none;
}

.gallery img{
    width:100%;
    min-width:100%;
    height:360px;
    object-fit:cover;
    border-radius:12px;
    scroll-snap-align:start;
}

.price{
    font-size:25px;
    font-weight:bold;
    margin:15px 0;
}

.buy{
    width:100%;
    border:none;
    background:#111;
    color:white;
    padding:15px;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.page{
    display:none;
}

.payment-box{
    background:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.payment-box h2{
    margin-bottom:10px;
}

.pay-price{
    font-size:28px;
    font-weight:bold;
    margin:15px 0;
}

.qr{
    width:230px;
    height:230px;
    object-fit:contain;
    margin:10px auto 20px;
    display:block;
    border:1px solid #ddd;
}

.back{
    border:none;
    background:#ddd;
    padding:12px 20px;
    border-radius:8px;
    margin-bottom:15px;
    cursor:pointer;
}

.download-box{
    display:none;
    margin-top:25px;
    padding:18px;
    background:#e9ffe9;
    border-radius:12px;
}

.download-btn{
    display:block;
    margin-top:12px;
    background:#168a32;
    color:white;
    text-decoration:none;
    padding:14px;
    border-radius:9px;
    font-weight:bold;
}

.note{
    font-size:13px;
    color:#555;
    margin-top:10px;
    line-height:1.5;
}
</style>
</head>

<body>

<header>
    <h1>BGMI ID STORE</h1>
</header>

<!-- HOME PAGE -->
<div id="homePage" class="container">

    <div class="product">

        <!-- MAIN BGMI VIDEO -->
        <video class="video" controls playsinline>
            <source src="bgmi1.mp4" type="video/mp4">
        </video>

        <!-- PHOTOS -->
        <div class="gallery">

            <img src="IMG_20260930_073955_202.jpg">
            <img src="IMG_20260930_073955_257.jpg">
            <img src="IMG_20260930_073955_346.jpg">
            <img src="IMG_20260930_073955_527.jpg">
            <img src="IMG_20260930_074058_007.jpg">
            <img src="IMG_20260930_074058_015.jpg">
            <img src="IMG_20260930_074058_121.jpg">
            <img src="IMG_20260930_074058_167.jpg">
            <img src="IMG_20260930_074058_359.jpg">
            <img src="IMG_20260930_074058_492.jpg">
            <img src="IMG_20260930_074058_566.jpg">
            <img src="IMG_20260930_074058_662.jpg">
            <img src="IMG_20260930_074058_681.jpg">
            <img src="IMG_20260930_074058_815.jpg">
            <img src="IMG_20260930_074235_867.jpg">
            <img src="IMG_20260930_074321_637.jpg">
            <img src="IMG_20260930_074321_673.jpg">
            <img src="IMG_20260930_074321_840.jpg">
            <img src="IMG_20260930_074321_896.jpg">
            <img src="IMG_20260930_074321_903.jpg">
            <img src="IMG_20260930_074322_060.jpg">
            <img src="IMG_20260930_074322_114.jpg">
            <img src="IMG_20260930_074322_134.jpg">
            <img src="IMG_20260930_074322_354.jpg">
            <img src="IMG_20260930_074322_411.jpg">

        </div>

        <div class="price">₹999</div>

        <button class="buy" onclick="openPayment()">
            BUY NOW
        </button>

    </div>

</div>


<!-- PAYMENT PAGE -->
<div id="paymentPage" class="container page">

    <button class="back" onclick="goHome()">
        ← Back
    </button>

    <div class="payment-box">

        <h2>Complete Payment</h2>

        <p>Pay the exact amount</p>

        <div class="pay-price">₹999</div>

        <!-- APNA QR IMAGE YAHAN LAGANA -->
        <img class="qr" src="qr.png" alt="UPI QR Code">

        <p>
            Scan the QR code using any supported UPI app
        </p>

        <button class="buy" onclick="showDownload()">
            PAY ₹999
        </button>

        <div id="downloadBox" class="download-box">

            <strong>Payment complete!</strong>

            <p class="note">
                Payment hone ke turant baad ID & Password
                download hona start ho jayega.
            </p>

            <!-- APNI REAL ID-PASS FILE KA NAAM YAHAN DENA -->
            <a class="download-btn"
               href="id-password.txt"
               download>
                DOWNLOAD ID & PASSWORD
            </a>

        </div>

    </div>

</div>


<script>

function openPayment(){
    document.getElementById("homePage").style.display="none";
    document.getElementById("paymentPage").style.display="block";
    window.scrollTo(0,0);
}

function goHome(){
    document.getElementById("paymentPage").style.display="none";
    document.getElementById("homePage").style.display="block";
    window.scrollTo(0,0);
}

function showDownload(){

    /*
      DEMO FLOW ONLY.

      Real payment verification ke liye payment gateway/backend
      integrate karna hoga. Ye button khud payment verify nahi karta.
    */

    document.getElementById("downloadBox").style.display="block";

}

</script>

</body>
              </html>
